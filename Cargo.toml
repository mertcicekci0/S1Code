[package]
name = "s1code"
version = "0.3.0-rc.2"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
description = "A terminal coding agent with bounded decisions and recoverable context"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6"
fs2 = "0.4"
futures-util = "0.3"
ignore = "0.4"
httpdate = "1"
libc = "0.2"
rand = "0.9"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "std", "unstable-rendered-line-info"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
proptest = "1"

[profile.release]
lto = "thin"
strip = true
